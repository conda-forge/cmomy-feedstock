{% set name = "cmomy" %}
{% set version = "1.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/cmomy-{{ version }}.tar.gz
  sha256: 281308c0f8d25884b71a123e63f68f337bf94a28f417deb6c115c926a51aac84

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build >=0.13.6,<0.14.0
    - pip
  run:
    - python >={{ python_min }}
    - docstring-inheritance
    - lazy-loader
    - module-utilities >=0.10.1
    - numba >=0.58
    - numpy >=1.24
    - pandas >=2.3.3
    - typing_extensions >=4.10.0
    - xarray >=2023.9.0

test:
  imports:
    - cmomy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/usnistgov/cmomy
  summary: Central (co)moment calculation/manipulation
  description: |
    A Python package to calculate and manipulate Central (co)moments.
    The main features of `cmomy` are 1) Fast calculation of central
    moments and comoments with weights.  The speed comes from using
    Numba.  2) Support for scalar and vector inputs. 3) Numpy and
    xarray DataArray interface. 4) Resampling.
  license: NIST-PD
  license_file: LICENSE

extra:
  recipe-maintainers:
    - wpk-nist-gov
